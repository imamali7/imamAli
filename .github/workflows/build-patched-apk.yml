name: Build patched Islamic Keyboard APK
# Build definition updated after fixing the patch script.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/clipboard-history-floating-panel
    paths:
      - .github/workflows/build-patched-apk.yml
      - "**.apk"

permissions:
  contents: read

concurrency:
  group: patched-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode and apply clipboard fixes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find . -maxdepth 1 -type f -iname '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one source APK in repository root." >&2
            exit 1
          fi
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            --output apktool.jar
          java -jar apktool.jar d -f "${apks[0]}" -o decoded

          python3 - <<'PY'
          from pathlib import Path

          root = Path("decoded")
          main = root / "smali/com/android/inputmethod/latin/DictionaryEditor.smali"
          text = main.read_text(encoding="utf-8")

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} anchor, found {count}")
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              "    :cond_1\n    return-void\n\n    .line 180\n",
              "    :cond_1\n"
              "    # Enable clipboard history capture for every input-method session.\n"
              "    invoke-virtual {p0}, Lcom/android/inputmethod/latin/DictionaryEditor;->tmron()V\n"
              "    return-void\n\n    .line 180\n",
              "clipboard listener activation",
          )

          text = replace_once(
              text,
              "    .line 562\n"
              "    iget-object v2, p0, Lcom/android/inputmethod/latin/DictionaryEditor;->db:Landroid/database/sqlite/SQLiteDatabase;\n\n"
              "    new-instance v3, Ljava/lang/StringBuilder;\n",
              "    .line 562\n"
              "    iget-object v2, p0, Lcom/android/inputmethod/latin/DictionaryEditor;->db:Landroid/database/sqlite/SQLiteDatabase;\n"
              "    const-string v3, \"'\"\n"
              "    const-string v4, \"''\"\n"
              "    invoke-virtual {p1, v3, v4}, Ljava/lang/String;->replace(Ljava/lang/CharSequence;Ljava/lang/CharSequence;)Ljava/lang/String;\n"
              "    move-result-object p1\n\n"
              "    new-instance v3, Ljava/lang/StringBuilder;\n",
              "SQL-safe clipboard text persistence",
          )

          text = replace_once(text, ".method po1()V\n    .locals 8", ".method po1()V\n    .locals 12", "clipboard panel register allocation")

          text = replace_once(
              text,
              "    const/16 v4, 0x3e8\n\n"
              "    iput v4, v2, Landroid/view/WindowManager$LayoutParams;->type:I\n\n"
              "    .line 166\n"
              "    iget-object v4, p0, Lcom/android/inputmethod/latin/DictionaryEditor;->Al:Landroid/app/AlertDialog;\n\n"
              "    invoke-virtual {v4, v3}, Landroid/app/AlertDialog;->setView(Landroid/view/View;)V\n\n"
              "    .line 167\n",
              "    const/16 v4, 0x3e8\n\n"
              "    iput v4, v2, Landroid/view/WindowManager$LayoutParams;->type:I\n\n"
              "    # Use screen-relative positioning and a visible drag handle.\n"
              "    const/16 v4, 0x33\n"
              "    iput v4, v2, Landroid/view/WindowManager$LayoutParams;->gravity:I\n"
              "    const/16 v4, 0x18\n"
              "    iput v4, v2, Landroid/view/WindowManager$LayoutParams;->x:I\n"
              "    const/16 v4, 0x78\n"
              "    iput v4, v2, Landroid/view/WindowManager$LayoutParams;->y:I\n"
              "    iget-object v4, p0, Lcom/android/inputmethod/latin/DictionaryEditor;->Al:Landroid/app/AlertDialog;\n"
              "    invoke-virtual {v4}, Landroid/app/AlertDialog;->getWindow()Landroid/view/Window;\n"
              "    move-result-object v4\n"
              "    invoke-virtual {v4, v2}, Landroid/view/Window;->setAttributes(Landroid/view/WindowManager$LayoutParams;)V\n\n"
              "    .line 166\n"
              "    iget-object v4, p0, Lcom/android/inputmethod/latin/DictionaryEditor;->Al:Landroid/app/AlertDialog;\n\n"
              "    invoke-virtual {v4, v3}, Landroid/app/AlertDialog;->setView(Landroid/view/View;)V\n\n"
              "    new-instance v7, Landroid/widget/TextView;\n"
              "    invoke-direct {v7, p0}, Landroid/widget/TextView;-><init>(Landroid/content/Context;)V\n"
              "    const-string v8, \"الحافظة  •  اسحب للتحريك\"\n"
              "    invoke-virtual {v7, v8}, Landroid/widget/TextView;->setText(Ljava/lang/CharSequence;)V\n"
              "    const/16 v8, 0x11\n"
              "    invoke-virtual {v7, v8}, Landroid/widget/TextView;->setGravity(I)V\n"
              "    const/4 v8, -0x1\n"
              "    invoke-virtual {v7, v8}, Landroid/widget/TextView;->setTextColor(I)V\n"
              "    const v8, -0xcccccd\n"
              "    invoke-virtual {v7, v8}, Landroid/widget/TextView;->setBackgroundColor(I)V\n"
              "    const/high16 v8, 0x41800000\n"
              "    invoke-virtual {v7, v8}, Landroid/widget/TextView;->setTextSize(F)V\n"
              "    new-instance v8, Landroid/widget/LinearLayout$LayoutParams;\n"
              "    const/4 v9, -0x1\n"
              "    const/16 v10, 0x30\n"
              "    invoke-direct {v8, v9, v10}, Landroid/widget/LinearLayout$LayoutParams;-><init>(II)V\n"
              "    const/4 v9, 0x0\n"
              "    invoke-virtual {v3, v7, v9, v8}, Landroid/view/ViewGroup;->addView(Landroid/view/View;ILandroid/view/ViewGroup$LayoutParams;)V\n"
              "    new-instance v8, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;\n"
              "    iget-object v9, p0, Lcom/android/inputmethod/latin/DictionaryEditor;->Al:Landroid/app/AlertDialog;\n"
              "    invoke-direct {v8, p0, v9}, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;-><init>(Lcom/android/inputmethod/latin/DictionaryEditor;Landroid/app/AlertDialog;)V\n"
              "    invoke-virtual {v7, v8}, Landroid/widget/TextView;->setOnTouchListener(Landroid/view/View$OnTouchListener;)V\n\n"
              "    .line 167\n",
              "movable clipboard window",
          )
          main.write_text(text, encoding="utf-8")

          listener = root / "smali/com/android/inputmethod/latin/DictionaryEditor$20.smali"
          text = listener.read_text(encoding="utf-8")
          # Keep the copied string byte-for-byte; dbadd now escapes SQL quotes safely.
          marker = '    .line 214\n    .local v0, "t":Ljava/lang/String;\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Clipboard callback anchor not found")
          end = text.find("    .line 215\n", start)
          if end < 0:
              raise SystemExit("Clipboard callback end anchor not found")
          text = text[:start] + marker + text[end:]
          listener.write_text(text, encoding="utf-8")

          layout = root / "res/layout/layout1.xml"
          text = layout.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '<LinearLayout android:background="#ff000000"',
              '<LinearLayout android:orientation="vertical" android:background="#ff000000"',
              "clipboard panel vertical layout",
          )
          layout.write_text(text, encoding="utf-8")

          # Normalize the APK's legacy custom-attribute namespace for AAPT2.
          legacy_namespace = "http://schemas.android.com/apk/res/inputmethod.latin.perfectkeyboard"
          for resource_xml in (root / "res").rglob("*.xml"):
              xml_text = resource_xml.read_text(encoding="utf-8")
              if legacy_namespace in xml_text:
                  resource_xml.write_text(
                      xml_text.replace(legacy_namespace, "http://schemas.android.com/apk/res-auto"),
                      encoding="utf-8",
                  )

          drag_listener = root / "smali/com/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener.smali"
          drag_listener.write_text("""          .class Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;
          .super Ljava/lang/Object;
          .source "DictionaryEditor.java"

          # interfaces
          .implements Landroid/view/View$OnTouchListener;

          # instance fields
          .field private final dialog:Landroid/app/AlertDialog;
          .field private downRawX:F
          .field private downRawY:F
          .field private initialX:I
          .field private initialY:I
          .field final synthetic this$0:Lcom/android/inputmethod/latin/DictionaryEditor;

          # direct methods
          .method constructor <init>(Lcom/android/inputmethod/latin/DictionaryEditor;Landroid/app/AlertDialog;)V
              .locals 0
              iput-object p1, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->this$0:Lcom/android/inputmethod/latin/DictionaryEditor;
              iput-object p2, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->dialog:Landroid/app/AlertDialog;
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method

          # virtual methods
          .method public onTouch(Landroid/view/View;Landroid/view/MotionEvent;)Z
              .locals 7
              invoke-virtual {p2}, Landroid/view/MotionEvent;->getActionMasked()I
              move-result v0
              if-nez v0, :move_check
              invoke-virtual {p2}, Landroid/view/MotionEvent;->getRawX()F
              move-result v1
              iput v1, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->downRawX:F
              invoke-virtual {p2}, Landroid/view/MotionEvent;->getRawY()F
              move-result v1
              iput v1, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->downRawY:F
              iget-object v1, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->dialog:Landroid/app/AlertDialog;
              invoke-virtual {v1}, Landroid/app/AlertDialog;->getWindow()Landroid/view/Window;
              move-result-object v1
              invoke-virtual {v1}, Landroid/view/Window;->getAttributes()Landroid/view/WindowManager$LayoutParams;
              move-result-object v2
              iget v3, v2, Landroid/view/WindowManager$LayoutParams;->x:I
              iput v3, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->initialX:I
              iget v3, v2, Landroid/view/WindowManager$LayoutParams;->y:I
              iput v3, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->initialY:I
              const/4 v0, 0x1
              return v0
              :move_check
              const/4 v1, 0x2
              if-ne v0, v1, :handled
              invoke-virtual {p2}, Landroid/view/MotionEvent;->getRawX()F
              move-result v1
              iget v2, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->downRawX:F
              sub-float/2addr v1, v2
              invoke-static {v1}, Ljava/lang/Math;->round(F)I
              move-result v1
              iget v2, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->initialX:I
              add-int/2addr v1, v2
              if-gez v1, :x_ok
              const/4 v1, 0x0
              :x_ok
              invoke-virtual {p2}, Landroid/view/MotionEvent;->getRawY()F
              move-result v2
              iget v3, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->downRawY:F
              sub-float/2addr v2, v3
              invoke-static {v2}, Ljava/lang/Math;->round(F)I
              move-result v2
              iget v3, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->initialY:I
              add-int/2addr v2, v3
              if-gez v2, :y_ok
              const/4 v2, 0x0
              :y_ok
              iget-object v3, p0, Lcom/android/inputmethod/latin/DictionaryEditor$ClipboardDragListener;->dialog:Landroid/app/AlertDialog;
              invoke-virtual {v3}, Landroid/app/AlertDialog;->getWindow()Landroid/view/Window;
              move-result-object v3
              invoke-virtual {v3}, Landroid/view/Window;->getAttributes()Landroid/view/WindowManager$LayoutParams;
              move-result-object v4
              iput v1, v4, Landroid/view/WindowManager$LayoutParams;->x:I
              iput v2, v4, Landroid/view/WindowManager$LayoutParams;->y:I
              invoke-virtual {v3, v4}, Landroid/view/Window;->setAttributes(Landroid/view/WindowManager$LayoutParams;)V
              :handled
              const/4 v0, 0x1
              return v0
          .end method
          """.replace("\n          ", "\n").lstrip(), encoding="utf-8")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          java -jar apktool.jar b decoded -o output/IslamicKeyboard-unsigned.apk

      - name: Set up Android build tools and sign APK
        uses: android-actions/setup-android@v3

      - name: Align, sign, and verify
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0" "platforms;android-35"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -p -f 4 output/IslamicKeyboard-unsigned.apk output/IslamicKeyboard-aligned.apk
          keytool -genkeypair -v -keystore output/debug-signing.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          "$BUILD_TOOLS/apksigner" sign --ks output/debug-signing.keystore \
            --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --out output/IslamicKeyboard-patched.apk output/IslamicKeyboard-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose output/IslamicKeyboard-patched.apk
          sha256sum output/IslamicKeyboard-patched.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamicKeyboard-patched
          path: output/IslamicKeyboard-patched.apk
          if-no-files-found: error
          retention-days: 14
